name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CLOUD_ENDPOINT: ${{ secrets.VITE_CLOUD_ENDPOINT || 'https://vktovorubdurbkpssgty.supabase.co' }}
          VITE_CLOUD_TOKEN: ${{ secrets.VITE_CLOUD_TOKEN || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrdG92b3J1YmR1cmJrcHNzZ3R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjYxNDksImV4cCI6MjEwNzE0MjE0OX0.BF2AEWt0PcJdLybjRMhD-_E3xX-TQixI_DZ-VyRVqVk' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
